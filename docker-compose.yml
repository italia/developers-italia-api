services:
  api:
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - default
    volumes:
      - .:/opt/app/api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: 'host=db user=postgres password=postgres dbname=postgres port=5432'
      ENVIRONMENT: local

  db:
    # Same image the CI test job runs against
    image: postgres:14@sha256:a209aced4fa19381231fae4d9a4c5816f7691294f13572f8bddc082ba32e1c7c
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
