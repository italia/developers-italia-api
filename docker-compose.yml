services:
  api:
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - default
    volumes:
      - .:/opt/app/api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: 'host=db user=postgres password=postgres dbname=postgres port=5432'
      ENVIRONMENT: local

  db:
    # Same image the CI test job runs against
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
