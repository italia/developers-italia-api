on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All history, required for goreleaser
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - # For TagBody, TagSubject or TagContents fields in goreleaser's templates
        run: git fetch --force --tags
      - # FIXME: goreleaser should already take care of the login
        # (see https://github.com/goreleaser/goreleaser/blame/02a3486d4ba59505113a57b438ae567351ed3dab/scripts/entrypoint.sh#L17)
        # but it doesn't work for some reason.
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u docker --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - # goreleaser shells out to syft for the sboms stanza
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        id: goreleaser
        with:
          version: v2.15.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/checksums.txt
      - # Attach the provenance to the release, where tools like scorecard
        # expect to find it (*.intoto.jsonl)
        run: |
          cp "$BUNDLE_PATH" checksums.txt.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" checksums.txt.intoto.jsonl
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
